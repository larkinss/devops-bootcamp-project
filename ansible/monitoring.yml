---
- name: Deploy Prometheus and Grafana monitoring stack
  hosts: monitoring
  become: true

  tasks:
    - name: Create monitoring directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/monitoring
        - /opt/monitoring/grafana/provisioning/datasources
        - /opt/monitoring/grafana/provisioning/dashboards

    - name: Deploy prometheus.yml config (bind mount source)
      ansible.builtin.template:
        src: templates/prometheus.yml.j2
        dest: /opt/monitoring/prometheus.yml
        mode: "0644"

    - name: Deploy Grafana datasource provisioning
      ansible.builtin.template:
        src: templates/grafana-datasource.yml.j2
        dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"

    - name: Deploy Grafana dashboard provider config
      ansible.builtin.template:
        src: templates/grafana-dashboard-provider.yml.j2
        dest: /opt/monitoring/grafana/provisioning/dashboards/provider.yml
        mode: "0644"

    - name: Deploy Grafana dashboard JSON
      ansible.builtin.copy:
        src: templates/node-exporter-dashboard.json
        dest: /opt/monitoring/grafana/provisioning/dashboards/node-exporter-dashboard.json
        mode: "0644"

    - name: Deploy docker-compose file for monitoring stack
      ansible.builtin.template:
        src: templates/docker-compose.monitoring.yml.j2
        dest: /opt/monitoring/docker-compose.yml
        mode: "0644"

    - name: Start Prometheus and Grafana via docker compose
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        state: present
